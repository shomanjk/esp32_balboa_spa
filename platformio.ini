; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = Balboa Spa WiFi Module
default_envs = ESP32serial
boards_dir = boards
data_dir = balboa-spa/dist

[libraries]
circularbuffer = rlogiacco/CircularBuffer @ ^1.3.3
pubsubclient = PubSubClient@2.8
arduinojson = ArduinoJson@6.18.3
wifimanager32 = https://github.com/tzapu/WiFiManager.git#9f5981e
ticker = sstaub/TickTwo@^4.4.0
arduinolog = thijse/ArduinoLog@1.1.1
dallastemperature = milesburton/DallasTemperature @ ^3.11.0
crc8 = RobTillaart/CRC
espasyncwebserver = https://github.com/me-no-dev/ESPAsyncWebServer.git
base64 = https://github.com/Densaugeo/base64_arduino.git
telnet = jandrassy/TelnetStream
m5atom = m5stack/M5Atom @ ^0.1.3
fastled = fastled/FastLED @ ^3.5.0
edp47 = https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#esp32s3
spi = SPI

[com]
platform = espressif32@6.8.1
board = m5stack-atom
monitor_filters = esp32_exception_decoder
framework = arduino
build_type = debug
board_build.filesystem = littlefs
board_build.partitions = spa_module.csv
extra_scripts = post:scripts/extra_script.py
build_flags = 
	'-DLOG_LEVEL=LOG_LEVEL_VERBOSE'
	-D ARDUINO_ARCH_ESP32
	-I "${platformio.packages_dir}/framework-arduinoespressif32/cores/esp32"
	-I "${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include"
	-I "${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/esp32"
	-I "${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/freertos"
	-I "${platformio.packages_dir}/framework-arduinoespressif32/tools/sdk/esp32/include/driver"
	-I "${platformio.packages_dir}/framework-arduinoespressif32/libraries"
	-I "${platformio.packages_dir}/framework-arduinoespressif32/libraries/Wire/src"
	-I "${platformio.packages_dir}/framework-arduinoespressif32/variants/m5stack-atom"
lib_deps = 
	${libraries.wifimanager32}
	${libraries.CircularBuffer}
	${libraries.PubSubClient}
	${libraries.ArduinoJson}
	${libraries.Ticker}
	${libraries.arduinolog}
	${libraries.DallasTemperature}
	${libraries.CRC8}
	${libraries.ESPAsyncWebServer}
	${libraries.base64}
	${libraries.telnet}
	${libraries.m5atom}
	${libraries.fastled}

[com-edp47]
build_flags = 
	'-DARDUINO_USB_CDC_ON_BOOT=1'
lib_deps = 
	${libraries.edp47}
	${libraries.SPI}

[env:ESP32serial]
platform = ${com.platform}
board = ${com.board}
monitor_filters = ${com.monitor_filters}
framework = ${com.framework}
build_type = ${com.build_type}
board_build.filesystem = ${com.board_build.filesystem}
board_build.partitions = ${com.board_build.partitions}
extra_scripts = ${com.extra_scripts}
lib_deps = 
	${com.lib_deps}
	fastled/FastLED @ ^3.5.0
	m5stack/M5Atom@^0.1.3
build_flags = 
	${com.build_flags}
	'-DPRODUCTION'
	'-DLOCAL_CONNECT'
	'-DLOCAL_CLIENT'
	'-DBRIDGE'
	'-DTELNET_LOG'
monitor_port = COM13
monitor_speed = 115200
upload_port = COM13
upload_speed = 1500000

[env:ESP32ota]
platform = ${com.platform}
board = ${com.board}
monitor_filters = ${com.monitor_filters}
framework = ${com.framework}
build_type = ${com.build_type}
board_build.filesystem = ${com.board_build.filesystem}
board_build.partitions = ${com.board_build.partitions}
extra_scripts = ${com.extra_scripts}
lib_deps = 
	${com.lib_deps}
	m5stack/M5Atom@^0.1.3
build_flags = 
	${com.build_flags}
	'-DPRODUCTION'
	'-DTELNET_LOG'
monitor_port = /dev/cu.usbserial-0001
monitor_speed = 115200
upload_port = spa-3C71BF9DFA90.local.
upload_protocol = espota

[env:ESP32prodOta]
platform = ${com.platform}
board = ${com.board}
monitor_filters = ${com.monitor_filters}
framework = ${com.framework}
build_type = ${com.build_type}
board_build.filesystem = ${com.board_build.filesystem}
board_build.partitions = ${com.board_build.partitions}
extra_scripts = ${com.extra_scripts}
lib_deps = ${com.lib_deps}
build_flags = 
	${com.build_flags}
	'-DPRODUCTION'
	'-DLOCAL_CONNECT'
	'-DLOCAL_CLIENT'
	'-DBRIDGE'
	'-DTELNET_LOG'
monitor_port = /dev/cu.usbserial-0001
monitor_speed = 115200
upload_port = spa-240AC4EC20DC.local.
upload_protocol = espota

[env:ESP32-epd47]
platform = ${com.platform}
board = T5-ePaper-S3
monitor_filters = ${com.monitor_filters}
framework = ${com.framework}
build_type = ${com.build_type}
board_build.filesystem = ${com.board_build.filesystem}
board_build.partitions = default_16MB.csv
extra_scripts = ${com.extra_scripts}
lib_deps = ${com.lib_deps}
	${com-edp47.lib_deps}
build_flags = 
	${com.build_flags}
	${com-edp47.build_flags}
	'-DREMOTE_CLIENT'
monitor_speed = 115200
upload_port = spa-7CDFA1FFF2B0.local
upload_protocol = espota
