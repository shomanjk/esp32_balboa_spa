; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = Balboa Spa WiFi Module
default_envs = ESP32ota
boards_dir = boards
data_dir = balboa-spa/dist

[libraries]
CircularBuffer = rlogiacco/CircularBuffer @ ^1.3.3
pubsubclient = PubSubClient@2.8
arduinojson = ArduinoJson@6.18.3
wifimanager32 = https://github.com/tzapu/WiFiManager.git#9f5981e
Ticker = sstaub/TickTwo@^4.4.0
arduinolog = thijse/ArduinoLog@1.1.1
DallasTemperature = milesburton/DallasTemperature @ ^3.11.0
CRC8 = RobTillaart/CRC
ESPAsyncWebServer = https://github.com/me-no-dev/ESPAsyncWebServer.git
base64 = https://github.com/Densaugeo/base64_arduino.git
telnet = jandrassy/TelnetStream
m5atom = m5stack/M5Atom @ ^0.1.3
fastled = fastled/FastLED @ ^3.5.0

; edp47 required libraries

edp47 = https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#esp32s3
Wire = Wire
SPI = SPI

[com]
platform = espressif32@6.8.1
board = esp32dev
monitor_filters = esp32_exception_decoder
framework = arduino
build_type = debug
board_build.filesystem = littlefs
board_build.partitions = spa_module.csv
extra_scripts = post:scripts/extra_script.py

build_flags =
  '-DLOG_LEVEL=LOG_LEVEL_VERBOSE'

lib_deps = 
	${libraries.wifimanager32}
	${libraries.CircularBuffer}
	${libraries.PubSubClient}
	${libraries.ArduinoJson}
	${libraries.Ticker}
	${libraries.arduinolog}
	${libraries.DallasTemperature}
	${libraries.CRC8}
	${libraries.ESPAsyncWebServer}
	${libraries.base64}
	${libraries.telnet}

[com-edp47]
build_flags =
    '-DARDUINO_USB_CDC_ON_BOOT=1'

lib_deps = 
	${libraries.Wire}
	${libraries.edp47}
	${libraries.SPI}

[env:ESP32serial]
platform = ${com.platform}
board =  ${com.board}
monitor_filters = ${com.monitor_filters}
framework = ${com.framework}
build_type = ${com.build_type}
board_build.filesystem = ${com.board_build.filesystem}
board_build.partitions = ${com.board_build.partitions}
extra_scripts = ${com.extra_scripts}

lib_deps = ${com.lib_deps}

build_flags =
  ${com.build_flags}
  '-DPRODUCTION'
;	'-DLOCAL_CONNECT'
;  '-DLOCAL_CLIENT'
;	'-DBRIDGE'
  '-DREMOTE_CLIENT'
;	'-DTELNET_LOG'

monitor_port = /dev/cu.usbserial-0001
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
upload_speed = 921600

[env:ESP32ota]
platform = ${com.platform}
board =  ${com.board}
monitor_filters = ${com.monitor_filters}
framework = ${com.framework}
build_type = ${com.build_type}
board_build.filesystem = ${com.board_build.filesystem}
board_build.partitions = ${com.board_build.partitions}
extra_scripts = ${com.extra_scripts}

lib_deps = ${com.lib_deps}

build_flags =
  ${com.build_flags}
  '-DPRODUCTION'
;  '-DREMOTE_CLIENT'
	'-DLOCAL_CONNECT'
	'-DLOCAL_CLIENT'
	'-DBRIDGE'
; Optional: '-DTELNET_LOG' — TelnetStream listener on TCP 23 (logs remain on Serial + web ring; see README).

monitor_port = /dev/cu.usbserial-0001
monitor_speed = 115200

upload_port = spa-3C71BF9DFA90.local
upload_protocol = espota

[env:ESP32prodOta]
platform = ${com.platform}
board =  ${com.board}
monitor_filters = ${com.monitor_filters}
framework = ${com.framework}
build_type = ${com.build_type}
board_build.filesystem = ${com.board_build.filesystem}
board_build.partitions = ${com.board_build.partitions}
extra_scripts = ${com.extra_scripts}

lib_deps = ${com.lib_deps}

build_flags =
  ${com.build_flags}
  '-DPRODUCTION'
;  '-DREMOTE_CLIENT'	
	'-DLOCAL_CONNECT'
	'-DLOCAL_CLIENT'
	'-DBRIDGE'
; Optional: '-DTELNET_LOG' — TelnetStream listener on TCP 23 (logs remain on Serial + web ring; see README).

monitor_port = /dev/cu.usbserial-0001
monitor_speed = 115200

upload_port = spa-240AC4EC20DC.local. ; prod board
upload_protocol = espota

; Tub-side build for M5 Atom Lite (ESP32-PICO-D4, 4MB flash) + Atomic RS485 Base (see README).
; Set TX485_Rx / TX485_Tx / AUTO_TX in src/config.h — see src/config-example.h (M5 section).
[env:M5AtomLite-tub]
platform = ${com.platform}
board = m5stack-atom
monitor_filters = ${com.monitor_filters}
framework = ${com.framework}
build_type = ${com.build_type}
board_build.filesystem = littlefs
board_build.partitions = spa_module.csv
extra_scripts = ${com.extra_scripts}
lib_deps =
	${com.lib_deps}
	${libraries.m5atom}
	${libraries.fastled}
build_flags =
  ${com.build_flags}
  '-DPRODUCTION'
  '-DLOCAL_CONNECT'
  '-DLOCAL_CLIENT'
  '-DBRIDGE'
; Optional: '-DTELNET_LOG' — TelnetStream listener on TCP 23 (logs remain on Serial + web ring; see README).
  '-DM5_ATOM_LED'
  '-DDIAG_FAULT_CAPTURE'
  '-Wl,--wrap=esp_system_abort'
monitor_speed = 115200
upload_speed = 1500000
; macOS USB serial — change if the device enumerates under a different name
upload_port = /dev/cu.usbserial-3152EEB412
monitor_port = /dev/cu.usbserial-3152EEB412

[env:M5AtomLite-tub-ota]
platform = ${com.platform}
board = m5stack-atom
monitor_filters = ${com.monitor_filters}
framework = ${com.framework}
build_type = ${com.build_type}
board_build.filesystem = littlefs
board_build.partitions = spa_module.csv
extra_scripts = ${com.extra_scripts}
lib_deps =
	${com.lib_deps}
	${libraries.m5atom}
	${libraries.fastled}
build_flags =
  ${com.build_flags}
  '-DPRODUCTION'
  '-DLOCAL_CONNECT'
  '-DLOCAL_CLIENT'
  '-DBRIDGE'
; Optional: '-DTELNET_LOG' — TelnetStream listener on TCP 23 (logs remain on Serial + web ring; see README).
  '-DM5_ATOM_LED'
  '-DDIAG_FAULT_CAPTURE'
  '-Wl,--wrap=esp_system_abort'
monitor_speed = 115200
upload_protocol = espota
; Prefer hostname from serial logs. If OTA fails with "Host ... Not Found", mDNS failed — set upload_port to the spa's LAN IP (or pass --upload-port).
upload_port = spa-142B2FA1127C.local
; upload_port = 192.168.68.68

[env:ESP32-epd47]
platform = ${com.platform}
board = T5-ePaper-S3
monitor_filters = ${com.monitor_filters}
framework = ${com.framework}
build_type = ${com.build_type}
board_build.filesystem = ${com.board_build.filesystem}
board_build.partitions = default_16MB.csv
extra_scripts = ${com.extra_scripts}

lib_deps = ${com.lib_deps}
	${com-edp47.lib_deps}

build_flags =
  ${com.build_flags}
	${com-edp47.build_flags}
  '-DREMOTE_CLIENT'	
;	'-DLOCAL_CONNECT'
;	'-DLOCAL_CLIENT'
;	'-DTELNET_LOG'
	'-DspaEpaper'

;monitor_port = /dev/cu.usbmodem101
monitor_speed = 115200

upload_port = spa-7CDFA1FFF2B0.local  ; prod board
;upload_speed = 921600
upload_protocol = espota