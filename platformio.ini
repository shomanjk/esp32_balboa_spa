; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = Balboa Spa WiFi Module
default_envs = ESP32ota
boards_dir = boards
data_dir = balboa-spa/dist
extra_configs = platformio_local.ini

[libraries]
CircularBuffer = rlogiacco/CircularBuffer @ ^1.3.3
pubsubclient = PubSubClient@2.8
arduinojson = ArduinoJson@6.18.3
wifimanager32 = https://github.com/tzapu/WiFiManager.git#9f5981e
Ticker = sstaub/TickTwo@^4.4.0
arduinolog = thijse/ArduinoLog@1.1.1
DallasTemperature = milesburton/DallasTemperature @ ^3.11.0
CRC8 = RobTillaart/CRC
ESPAsyncWebServer = https://github.com/me-no-dev/ESPAsyncWebServer.git
base64 = https://github.com/Densaugeo/base64_arduino.git
telnet = jandrassy/TelnetStream
m5atom = m5stack/M5Atom @ ^0.1.3
fastled = fastled/FastLED @ ^3.5.0

; edp47 required libraries

edp47 = https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#esp32s3
Wire = Wire
SPI = SPI

[com]
; Shared defaults: every env below pulls ${com.build_flags} first, then adds its own -D lines.
platform = espressif32@6.8.1
board = esp32dev
monitor_filters = esp32_exception_decoder
framework = arduino
build_type = debug
board_build.filesystem = littlefs
board_build.partitions = spa_module.csv
extra_scripts = post:scripts/extra_script.py

; ArduinoLog compile-time ceiling (runtime level still capped via Log.setLevel / /api/logs/config).
build_flags =
	'-DLOG_LEVEL=LOG_LEVEL_VERBOSE'

lib_deps = 
	${libraries.wifimanager32}
	${libraries.CircularBuffer}
	${libraries.PubSubClient}
	${libraries.ArduinoJson}
	${libraries.Ticker}
	${libraries.arduinolog}
	${libraries.DallasTemperature}
	${libraries.CRC8}
	${libraries.ESPAsyncWebServer}
	${libraries.base64}
	${libraries.telnet}

[com-edp47]
; LilyGo T5 ESP32-S3: expose USB CDC serial on boot (see env ESP32-epd47).
build_flags =
	'-DARDUINO_USB_CDC_ON_BOOT=1'

lib_deps = 
	${libraries.Wire}
	${libraries.edp47}
	${libraries.SPI}

[env:ESP32serial]
platform = ${com.platform}
board =  ${com.board}
monitor_filters = ${com.monitor_filters}
framework = ${com.framework}
build_type = ${com.build_type}
board_build.filesystem = ${com.board_build.filesystem}
board_build.partitions = ${com.board_build.partitions}
extra_scripts = ${com.extra_scripts}

lib_deps = ${com.lib_deps}

; USB-serial “remote client” build: TCP to tub gateway (4257), not tub RS485.
build_flags =
	${com.build_flags}
	; Reserved marker kept on shipped-style envs (available to #ifdef in fork/tooling).
	'-DPRODUCTION'
	; Tub-side RS485 / discovery / bridge — off here because REMOTE_CLIENT is on.
;	'-DLOCAL_CONNECT'
;  '-DLOCAL_CLIENT'
;	'-DBRIDGE'
	'-DREMOTE_CLIENT'
	; Optional TelnetStream on TCP 23 when uncommented (see README / wifiModule).
;	'-DTELNET_LOG'

; USB upload/monitor: platformio_local.ini or --upload-port / --monitor-port
monitor_speed = 115200
upload_speed = 921600

[env:ESP32ota]
platform = ${com.platform}
board =  ${com.board}
monitor_filters = ${com.monitor_filters}
framework = ${com.framework}
build_type = ${com.build_type}
board_build.filesystem = ${com.board_build.filesystem}
board_build.partitions = ${com.board_build.partitions}
extra_scripts = ${com.extra_scripts}

lib_deps = ${com.lib_deps}

; Default PlatformIO env ([platformio] default_envs): generic ESP32 dev board, tub-side RS485 + bridge + OTA.
build_flags =
	${com.build_flags}
	'-DPRODUCTION'
	; Remote/kitchen TCP client — off here (tub-side gateway build).
;  '-DREMOTE_CLIENT'
	'-DLOCAL_CONNECT'
	'-DLOCAL_CLIENT'
	'-DBRIDGE'
	; Optional TelnetStream on TCP 23 when uncommented (logs stay on Serial + web ring; see README).
; '-DTELNET_LOG'

; OTA upload target: platformio_local.ini or --upload-port spa-XXXXXXXXXXXX.local
monitor_speed = 115200
upload_protocol = espota

[env:ESP32prodOta]
platform = ${com.platform}
board =  ${com.board}
monitor_filters = ${com.monitor_filters}
framework = ${com.framework}
build_type = ${com.build_type}
board_build.filesystem = ${com.board_build.filesystem}
board_build.partitions = ${com.board_build.partitions}
extra_scripts = ${com.extra_scripts}

lib_deps = ${com.lib_deps}

; Same feature set as ESP32ota; separate OTA target via platformio_local.ini.
build_flags =
	${com.build_flags}
	'-DPRODUCTION'
;  '-DREMOTE_CLIENT'
	'-DLOCAL_CONNECT'
	'-DLOCAL_CLIENT'
	'-DBRIDGE'
	; Optional TelnetStream on TCP 23 when uncommented (logs stay on Serial + web ring; see README).
; '-DTELNET_LOG'

; OTA upload target: platformio_local.ini or --upload-port spa-XXXXXXXXXXXX.local
monitor_speed = 115200
upload_protocol = espota

; Tub-side build for M5 Atom Lite (ESP32-PICO-D4, 4MB flash) + Atomic RS485 Base (see README).
; Set TX485_Rx / TX485_Tx / AUTO_TX in src/config.h — see src/config-example.h (M5 section).
[env:M5AtomLite-tub]
platform = ${com.platform}
board = m5stack-atom
monitor_filters = ${com.monitor_filters}
framework = ${com.framework}
build_type = ${com.build_type}
board_build.filesystem = littlefs
board_build.partitions = spa_module.csv
extra_scripts = ${com.extra_scripts}
lib_deps =
	${com.lib_deps}
	${libraries.m5atom}
	${libraries.fastled}
; M5 Atom Lite on Atomic RS485 Base — primary tub-side target (see README).
build_flags =
	${com.build_flags}
	'-DPRODUCTION'
	'-DLOCAL_CONNECT'
	'-DLOCAL_CLIENT'
	'-DBRIDGE'
	; Optional TelnetStream on TCP 23 when uncommented (logs stay on Serial + web ring; see README).
; '-DTELNET_LOG'
	; Atom RGB + coarse RS485 activity (src/led_control.*).
	'-DM5_ATOM_LED'
	; RTC slow-memory fault ring + bridge breadcrumbs (see AGENTS.md / lib/faultCapture/).
	'-DDIAG_FAULT_CAPTURE'
	; Capture esp_system_abort() text on next boot (faultLog / DIAG path).
	'-Wl,--wrap=esp_system_abort'
monitor_speed = 115200
upload_speed = 1500000
; USB upload/monitor: platformio_local.ini or --upload-port / --monitor-port

[env:M5AtomLite-tub-ota]
platform = ${com.platform}
board = m5stack-atom
monitor_filters = ${com.monitor_filters}
framework = ${com.framework}
build_type = ${com.build_type}
board_build.filesystem = littlefs
board_build.partitions = spa_module.csv
extra_scripts = ${com.extra_scripts}
lib_deps =
	${com.lib_deps}
	${libraries.m5atom}
	${libraries.fastled}
; Same firmware flags as M5AtomLite-tub; upload via ArduinoOTA (espota) instead of USB.
build_flags =
	${com.build_flags}
	'-DPRODUCTION'
	'-DLOCAL_CONNECT'
	'-DLOCAL_CLIENT'
	'-DBRIDGE'
	; Optional TelnetStream on TCP 23 when uncommented (logs stay on Serial + web ring; see README).
; '-DTELNET_LOG'
	'-DM5_ATOM_LED'
	'-DDIAG_FAULT_CAPTURE'
	'-Wl,--wrap=esp_system_abort'
monitor_speed = 115200
upload_protocol = espota
; OTA upload target: platformio_local.ini, spa-XXXXXXXXXXXX.local, or LAN IP via --upload-port

[env:ESP32-epd47]
platform = ${com.platform}
board = T5-ePaper-S3
monitor_filters = ${com.monitor_filters}
framework = ${com.framework}
build_type = ${com.build_type}
board_build.filesystem = ${com.board_build.filesystem}
board_build.partitions = default_16MB.csv
extra_scripts = ${com.extra_scripts}

lib_deps = ${com.lib_deps}
	${com-edp47.lib_deps}

; LilyGo T5 ePaper (ESP32-S3): kitchen/remote display talking to tub gateway over TCP.
build_flags =
	${com.build_flags}
	${com-edp47.build_flags}
	; TCP client to tub-side bridge (4257), not RS485 on this board.
	'-DREMOTE_CLIENT'
;	'-DLOCAL_CONNECT'
;	'-DLOCAL_CLIENT'
	; Optional TelnetStream on TCP 23 when uncommented.
;	'-DTELNET_LOG'
	; ePaper UI + layout (spaEpaper sources).
	'-DspaEpaper'

;monitor_port = /dev/cu.usbmodem101
monitor_speed = 115200

; OTA upload target: platformio_local.ini or --upload-port spa-XXXXXXXXXXXX.local
;upload_speed = 921600
upload_protocol = espota