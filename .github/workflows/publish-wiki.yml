name: Publish wiki

on:
  push:
    branches: [main, ESP32]
    paths:
      - wiki/**
      - .github/workflows/publish-wiki.yml
  workflow_dispatch:

concurrency:
  group: publish-wiki
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: wiki
          strategy: init
          commit-message: "Sync wiki from ${{ github.sha }}"
          ignore: |
            BOOTSTRAP.md
